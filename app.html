<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ski Trivia Game</title>
  <style>
    /* General styles */
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #00457c;
    }

    .question {
      font-size: 20px;
      margin: 20px 0;
    }

    #answers {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin: 20px auto;
      max-width: 500px;
      padding: 20px;
      border: 2px solid #00457c;
      border-radius: 8px;
      background-color: #f9f9f9;
    }

    .answer {
      display: block;
      width: 100%;
      padding: 10px 20px;
      background: #00457c;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
      font-size: 16px;
    }

    .answer:hover {
      background: #003257;
    }

    .trivia-completed {
      font-size: 22px;
      margin-top: 20px;
      color: #37b24d;
    }

    .score {
      font-size: 18px;
      color: #00457c;
      margin-top: 20px;
    }

    button#restart {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #ffde59;
      color: #00457c;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    button#restart:hover {
      background-color: #ffd333;
    }
  </style>
</head>
<body>
  <div style="margin-bottom: 20px; text-align: center;">
    <a href="index.html" style="color: #00457c; text-decoration: none; font-weight: 600;">← Back Home</a>
  </div>
  <h1>Ski Trivia Game</h1>
  <p>Test your skiing knowledge! Answer each question below and see how well you do.</p>

  <div id="game">
    <!-- Trivia Question Display -->
    <div id="question-area">
      <p class="question" id="question">Loading question...</p>
      <div id="answers">
        <!-- Buttons for answers will be inserted here by JavaScript -->
      </div>
    </div>

    <!-- Score Display -->
    <div id="score-area" style="display: none;">
      <p class="trivia-completed">You've completed the Ski Trivia Game!</p>
      <p class="score" id="score">You scored X out of Y!</p>
      <button id="restart" onclick="restartGame()">Play Again</button>
    </div>
  </div>

  <script>
    // Trivia Questions Array
    const questions = [
      {
        question: "What is the name of the fastest type of skiing?",
        answers: ["Slalom", "Mogul Skiing", "Downhill Skiing", "Freestyle Skiing"],
        correct: 2 // Index (0-based) of the correct answer: "Downhill Skiing"
      },
      {
        question: "How many edges does a ski typically have?",
        answers: ["2", "4", "6", "8"],
        correct: 0 // Correct answer is "2".
      },
      {
        question: "Where is Alta Ski Resort located?",
        answers: ["Colorado", "Utah", "Montana", "Wyoming"],
        correct: 1 // Correct answer is "Utah".
      },
      {
        question: "What is the term for skiing both uphill and downhill using special bindings?",
        answers: ["Off-Piste", "Backcountry Skiing", "Touring", "Carving"],
        correct: 2 // Correct answer is "Touring".
      },
      {
        question: "Which country has the most Olympic gold medals in alpine skiing?",
        answers: ["Switzerland", "Germany", "United States", "Austria"],
        correct: 3 // Correct answer is "Austria".
      }
    ];

    // Game State
    let currentQuestionIndex = 0;
    let score = 0;

    // DOM Elements
    const questionElement = document.getElementById("question");
    const answersElement = document.getElementById("answers");
    const questionArea = document.getElementById("question-area");
    const scoreArea = document.getElementById("score");
    const triviaCompletedArea = document.getElementById("score-area");

    // Load a Question
    function loadQuestion() {
      if (currentQuestionIndex >= questions.length) {
        endGame();
        return;
      }

      const currentQuestion = questions[currentQuestionIndex];
      questionElement.textContent = currentQuestion.question;

      // Render the answer buttons
      answersElement.innerHTML = ""; // Clear any previous answers
      currentQuestion.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.classList.add("answer");
        button.textContent = answer;
        button.onclick = () => checkAnswer(index);
        answersElement.appendChild(button);
      });
    }

    // Check Answer
    function checkAnswer(selectedIndex) {
      const currentQuestion = questions[currentQuestionIndex];
      if (selectedIndex === currentQuestion.correct) {
        score++;
      }
      currentQuestionIndex++;
      loadQuestion();
    }

    // End the Game
    function endGame() {
      questionArea.style.display = "none";
      triviaCompletedArea.style.display = "block";
      scoreArea.textContent = `You scored ${score} out of ${questions.length}!`;
    }

    // Restart Game
    function restartGame() {
      currentQuestionIndex = 0;
      score = 0;
      questionArea.style.display = "block";
      triviaCompletedArea.style.display = "none";
      loadQuestion();
    }

    // Initialize Game
    loadQuestion();
  </script>
</body>
</html>
